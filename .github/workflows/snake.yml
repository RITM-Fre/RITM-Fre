name: Generate contribution snake

on:
  # Build once after setup, then refresh daily.
  push:
    branches:
      - main
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: RITM-Fre
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=67e8f9

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
